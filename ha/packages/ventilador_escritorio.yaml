# Pacote gerado por tools/gerar_pacote_broadlink.py (nao editar os codigos na mao)
# Ventilador do escritorio: ID 0x4119, envio pelo Broadlink (remote.universal_remote) em 433,92 MHz.
# Instalar: copie para /config/packages/ e garanta no configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages

input_boolean:
  ventilador_escritorio_alterna:
    name: "Ventilador do escritorio: alterna codigo"
    icon: mdi:swap-horizontal
  ventilador_escritorio_luz_estado:
    name: "Ventilador do escritorio: estado da luz"
    icon: mdi:lightbulb
  ventilador_escritorio_ligado:
    name: "Ventilador do escritorio: ligado"
    icon: mdi:ceiling-fan

input_number:
  ventilador_escritorio_velocidade:
    name: "Ventilador do escritorio: velocidade"
    icon: mdi:fan-speed-1
    min: 1
    max: 6
    step: 1
  ventilador_escritorio_percentual:
    name: "Ventilador do escritorio: percentual pedido"
    icon: mdi:percent
    min: 1
    max: 100
    step: 1

# Luz "otimista": o ventilador nao informa o estado, entao o HA guarda o
# ultimo estado que ele mesmo mandou. O botao do controle fisico dessincroniza.
template:
  - light:
      - name: "Luz escritório"
        unique_id: ventilador_escritorio_luz
        state: "{{ is_state('input_boolean.ventilador_escritorio_luz_estado', 'on') }}"
        turn_on:
          - condition: state
            entity_id: input_boolean.ventilador_escritorio_luz_estado
            state: "off"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ventilador_escritorio_luz_estado
          - action: script.ventilador_escritorio_comando
            data:
              comando: luz
        turn_off:
          - condition: state
            entity_id: input_boolean.ventilador_escritorio_luz_estado
            state: "on"
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ventilador_escritorio_luz_estado
          - action: script.ventilador_escritorio_comando
            data:
              comando: luz

  # Ventilador "otimista" (mesmo motivo da luz). 6 velocidades = degraus de ~17%.
  - fan:
      - name: "Ventilador escritório"
        unique_id: ventilador_escritorio_fan
        speed_count: 6
        state: "{{ is_state('input_boolean.ventilador_escritorio_ligado', 'on') }}"
        # Informa o percentual exato que foi pedido (a Alexa confere o valor
        # depois do comando e reclama se vier diferente, ex: pediu 30, voltou 33).
        # Tambem vale desligado: ao "ligar", a Alexa manda o ultimo valor e o
        # ventilador volta na mesma velocidade em vez de ir para a 6.
        percentage: "{{ states('input_number.ventilador_escritorio_percentual') | int(17) }}"
        # Quando o pedido ja traz um percentual (Alexa/Emulated Hue costuma mandar),
        # o HA chama turn_on E depois set_percentage. Para nao mandar 2 codigos
        # (2 bipes), o turn_on so envia quando NAO vier percentual.
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ventilador_escritorio_ligado
          - condition: template
            value_template: "{{ percentage is not defined or percentage is none }}"
          - action: script.ventilador_escritorio_comando
            data:
              comando: "v{{ states('input_number.ventilador_escritorio_velocidade') | int(1) }}"
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ventilador_escritorio_ligado
          - action: script.ventilador_escritorio_comando
            data:
              comando: fanoff
        set_percentage:
          - if:
              - condition: template
                value_template: "{{ percentage | int(0) == 0 }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.ventilador_escritorio_ligado
              - action: script.ventilador_escritorio_comando
                data:
                  comando: fanoff
            else:
              - variables:
                  vel: "{{ [1, ((percentage | int) * 6 / 100) | round(0, 'ceil') | int] | max }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.ventilador_escritorio_velocidade
                data:
                  value: "{{ vel }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.ventilador_escritorio_percentual
                data:
                  value: "{{ percentage | int }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ventilador_escritorio_ligado
              - action: script.ventilador_escritorio_comando
                data:
                  comando: "v{{ vel }}"

script:
  ventilador_escritorio_comando:
    alias: "Ventilador do escritorio: comando"
    description: "Envia um comando ao ventilador, alternando entre 2 variantes do codigo."
    mode: queued
    fields:
      comando:
        description: "Nome do comando"
        required: true
        example: luz
        selector:
          select:
            options:
              - label: "Luz ON/OFF"
                value: "luz"
              - label: "Desliga tudo"
                value: "off"
              - label: "Desliga ventilador"
                value: "fanoff"
              - label: "Velocidade 1"
                value: "v1"
              - label: "Velocidade 2"
                value: "v2"
              - label: "Velocidade 3"
                value: "v3"
              - label: "Velocidade 4"
                value: "v4"
              - label: "Velocidade 5"
                value: "v5"
              - label: "Velocidade 6"
                value: "v6"
              - label: "Vento natural"
                value: "vento"
              - label: "Verao/inverno"
                value: "rf"
              - label: "Bipe"
                value: "mudo"
              - label: "Brilho +"
                value: "brilho_mais"
              - label: "Brilho -"
                value: "brilho_menos"
              - label: "Cor mais fria"
                value: "k_mais"
              - label: "Cor mais quente"
                value: "k_menos"
              - label: "Troca a cor"
                value: "k"
              - label: "Luz noturna"
                value: "lua"
              - label: "Timer 1h"
                value: "timer_1h"
              - label: "Timer 2h"
                value: "timer_2h"
              - label: "Timer 4h"
                value: "timer_4h"
    variables:
      variante: "{{ 1 if is_state('input_boolean.ventilador_escritorio_alterna', 'on') else 0 }}"
      codigos:
        "luz":
          - 
          - 
        "off":
          - 
          - 
        "fanoff":
          - 
          - 
        "v1":
          - 
          - 
        "v2":
          - 
          - 
        "v3":
          - 
          - 
        "v4":
          - 
          - 
        "v5":
          - 
          - 
        "v6":
          - 
          - 
        "vento":
          - 
          - 
        "rf":
          - 
          - 
        "mudo":
          - 
          - 
        "brilho_mais":
          - 
          - 
        "brilho_menos":
          - 
          - 
        "k_mais":
          - 
          - 
        "k_menos":
          - 
          - 
        "k":
          - 
          - 
        "lua":
          - 
          - 
        "timer_1h":
          - 
          - 
        "timer_2h":
          - 
          - 
        "timer_4h":
          - 
          - 
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.universal_remote
        data:
          command: "b64:{{ codigos[comando][variante | int] }}"
      - action: input_boolean.toggle
        target:
          entity_id: input_boolean.ventilador_escritorio_alterna
