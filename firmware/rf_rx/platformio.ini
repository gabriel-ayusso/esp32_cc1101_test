; Projeto PlatformIO usando o .ino desta pasta sem alteracoes.
; Abrir esta pasta no VS Code (PlatformIO IDE) ou rodar: pio run -t upload
; A Arduino IDE ignora este arquivo, entao os dois continuam funcionando.

[platformio]
src_dir = .

[env:esp32]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_speed = 115200        ; 921600 falha com o CH9102X
monitor_speed = 115200
monitor_filters = send_on_enter   ; envia a linha so ao apertar Enter
monitor_echo = yes                ; mostra o que voce digita
monitor_eol = LF                  ; o sketch le ate o '\n'
lib_deps =
    https://github.com/mfurga/cc1101.git
